# The clients' account of the data server: nothing but internal-sftp -R
# in the chroot of the published tree; their keys in
# /data/tripscope/authorized_keys (edited in place).  What a key's
# `restrict` would do, here for every key of the account however its line
# is written: no forwarding of any kind, no tty, no ~/.ssh/rc.  (`Match
# all`: what the main config has after its Include is global again.)
Match User data
    ChrootDirectory /data/tripscope/export
    ForceCommand internal-sftp -R
    AuthorizedKeysFile /data/tripscope/authorized_keys
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
Match all
