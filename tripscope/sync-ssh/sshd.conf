# The clients' account of the sync server from outside (blatto's port
# 23152): nothing but a tunnel to the server — the workspace's
# `ssh="sync@…:23152"` with server="localhost:7443" (ssh -W, -L); their
# keys in /data/ssh/authorized_keys (edited in place: tripscope-sync-keys).
# For every key of the account however its line is written: no tty, no
# ~/.ssh/rc, no command, no forwarding but to the server.  (`Match all`:
# what the main config has after its Include is global again.)
Match User sync
    AuthorizedKeysFile /data/ssh/authorized_keys
    AllowTcpForwarding local
    PermitOpen localhost:7443 127.0.0.1:7443 [::1]:7443
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/bin/false
Match all
